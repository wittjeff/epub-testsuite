name: EPUBCheck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  EPUBCHECK_VERSION: 5.3.0
  EPUBCHECK_SHA256: 6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5

jobs:
  epubcheck:
    name: Validate every book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download EPUBCheck ${{ env.EPUBCHECK_VERSION }}
        run: |
          curl -sSL -o epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          echo "${EPUBCHECK_SHA256}  epubcheck.zip" | sha256sum -c -
          unzip -q epubcheck.zip -d "$RUNNER_TEMP"

      - name: Check every book
        run: util/epubcheck-all.sh "$RUNNER_TEMP/epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar"
